<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0C0F0D" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Metabolic City scores urban risk per H3 cell from mobility, climate and vulnerability data, so operators and field crews can see what changed and act on it." />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Metabolic City" />
    <meta property="og:title" content="Metabolic City | Urban risk operations" />
    <meta property="og:description" content="Score urban risk per H3 cell from mobility, climate and vulnerability data, then dispatch the crew that can act on it." />
    <meta property="og:url" content="https://metabolic-city.example/" />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Metabolic City | Urban risk operations" />
    <meta name="twitter:description" content="Score urban risk per H3 cell from mobility, climate and vulnerability data." />
    <meta name="twitter:image" content="/icon-512.png" />
    <link rel="canonical" href="https://metabolic-city.example/" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <script>
      try {
        var savedTheme = localStorage.getItem('mc-theme');
        var theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (error) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
    <title>Metabolic City | Urban risk operations</title>
    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
