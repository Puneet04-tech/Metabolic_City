<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">H3 city atlas</title>
  <desc id="desc">A dark operational map plate with hexagonal risk cells, contour lines and a response route.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9caa9e" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <pattern id="fine" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="#9caa9e" stroke-opacity=".025" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151c16"/>
      <stop offset="1" stop-color="#0b0e0c"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1400" height="1000" fill="url(#fade)"/>
  <rect width="1400" height="1000" fill="url(#grid)"/>
  <rect width="1400" height="1000" fill="url(#fine)"/>

