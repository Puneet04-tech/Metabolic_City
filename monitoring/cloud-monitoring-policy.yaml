displayName: metabolic-city-api-5xx-rate
combiner: OR
conditions:
  - displayName: API 5xx rate above one percent
    conditionThreshold:
      filter: >-
        metric.type="run.googleapis.com/request_count"
        resource.type="cloud_run_revision"
        metric.labels.response_code_class="5xx"
      comparison: COMPARISON_GT
      thresholdValue: 0.01
      duration: 300s
      aggregations:
        - alignmentPeriod: 300s
          perSeriesAligner: ALIGN_RATE
          crossSeriesReducer: REDUCE_SUM
notificationChannels: []
documentation:
  content: >-
    Configure an email or pager notification channel before applying this policy.
    Render deployments should use Render metrics and alerts for the equivalent
    five-minute HTTP 5xx alert because Cloud Run metrics do not apply to Render.
  mimeType: text/markdown